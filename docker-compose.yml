x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: gtfs-airflow:2.9.3
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/New_York
    PROJECT_DIR: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
    GCP_PROJECT: ${GCP_PROJECT:-}
    BQ_DATASET: ${BQ_DATASET:-}
    GCS_BUCKET: ${GCS_BUCKET:-}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/secrets/gcp-key.json
  volumes:
    - ./dags:/opt/airflow/dags
    - ./:/opt/airflow/project
    - ./logs:/opt/airflow/logs
    - ${GCP_KEY_FILE:-./secrets/gcp-key.json}:/opt/airflow/secrets/gcp-key.json:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Admin --lastname User --role Admin --email admin@example.com &&
      airflow connections add fs_default --conn-type fs --conn-extra '{\"path\": \"/\"}' || true"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
